name: CI

# Every check, on every push to main and every pull request, and the release gate: release.yml calls
# this workflow on the tagged commit and packages nothing unless every job passed.
#
#   - frontend: type check, lint, formatting, unit tests (jest), production build;
#   - backend: gofmt, go vet, golangci-lint, the unit tests and the live tests against a real
#     hardcharger-server (the `hardcharger` Python package downloads the released binary), then the
#     backend for every platform with CGO_ENABLED=0;
#   - e2e: Playwright against a real Grafana and a real Hardcharger server (docker compose);
#   - package: the plugin zip, the version check and Grafana's plugin validator.
#
# The live and end-to-end tests need a server: they FAIL when it can't start. Nothing skips.

on:
  push:
    branches: [main]
    # Files that nothing builds, tests or packages. README.md and CHANGELOG.md are NOT here: both go
    # into the plugin zip, which the validator checks.
    paths-ignore:
      - 'docs/**'
      - 'NOTICE'
      - 'CLAUDE.md'
      - '.gitattributes'
      - '.github/dependabot.yml'
  # Every pull request runs, documentation-only ones too: "CI result" is the check to require in
  # branch protection, and a required check that never reports would block the merge.
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # The Hardcharger server the live tests run (scripts/hardcharger-server.sh) and the e2e stack's.
  HARDCHARGER_VERSION: '2.12.0'
  # The released server binary is downloaded from GitHub: authenticate so the download isn't rate
  # limited.
  HARDCHARGER_INSTALL_TOKEN: ${{ github.token }}
  PLUGIN_VALIDATOR_VERSION: '0.53.6'
  GOLANGCI_LINT_VERSION: 'v2.15.0'

jobs:
  # A push to main of a commit this workflow already passed on (a fast-forward merge of a tested
  # branch) doesn't test it again. Tags, pull requests and manual runs always test.
  gate:
    name: Already tested?
    runs-on: ubuntu-24.04-arm
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run=true
          reason="a $EVENT run on $REF"
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            passed=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success" --jq '.total_count')
            if [ "$passed" -gt 0 ]; then
              run=false
              reason="commit $SHA already passed this workflow $passed time(s)"
            fi
          fi
          echo "run=$run ($reason)"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "**Tests:** run=\`$run\` ($reason)" >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Unit tests
        run: npm run test:ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist-frontend
          path: dist/
          retention-days: 5
          if-no-files-found: error

  backend:
    name: Backend
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l pkg Magefile.go)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-formatted: $unformatted"
            exit 1
          fi
      - run: go vet ./pkg/...
      - name: golangci-lint
        run: go run "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$GOLANGCI_LINT_VERSION" run ./pkg/...
      # The server binary comes from GitHub's release downloads, which answer 5xx now and then: the
      # script fetches it once, with retries, and the tests still fail if no server can be had.
      - name: Download the Hardcharger server
        run: echo "HARDCHARGER_SERVER_BINARY=$(scripts/hardcharger-server.sh)" >> "$GITHUB_ENV"
      - name: Unit and live tests (a real Hardcharger server), with the race detector
        run: scripts/go-test.sh -race
      - name: The backend for every platform, without cgo
        run: |
          go run github.com/magefile/mage -v buildAll
          ls -l dist
          for platform in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64.exe; do
            if ! [ -s "dist/gpx_hardcharger_datasource_$platform" ]; then
              echo "::error::no backend binary for $platform"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v7
        with:
          name: dist-backend
          path: dist/
          retention-days: 5
          if-no-files-found: error

  e2e:
    name: End to end (Grafana and Hardcharger)
    needs: [frontend, backend]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: The backend binaries are executable again
        run: chmod +x dist/gpx_*
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start Grafana and Hardcharger
        env:
          ANONYMOUS_AUTH_ENABLED: 'false'
          DEVELOPMENT: 'false'
        run: |
          docker compose up -d --build
          for attempt in $(seq 1 90); do
            if curl -sf http://127.0.0.1:3000/api/health >/dev/null; then
              echo "Grafana answers after $attempt attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Grafana did not start"
          docker compose logs
          exit 1
      - name: Install the test browser
        run: npx playwright install chromium --with-deps
      - name: End-to-end tests
        env:
          GRAFANA_URL: http://127.0.0.1:3000
        run: npm run e2e
      - name: Logs of the stack
        if: failure()
        run: docker compose logs --no-color > stack.log 2>&1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-failure
          path: |
            playwright-report/
            test-results/
            stack.log
          retention-days: 5
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  package:
    name: Package and validate
    needs: [frontend, backend]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: package.json, plugin.json and CHANGELOG.md agree on the version
        run: scripts/check-version.sh
      - name: Package
        id: package
        run: echo "archive=$(scripts/package.sh)" >> "$GITHUB_OUTPUT"
      - name: Grafana's plugin validator
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: npx -y "@grafana/plugin-validator@$PLUGIN_VALIDATOR_VERSION" -sourceCodeUri file://./ "$ARCHIVE"
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-zip
          path: |
            gizmodata-hardcharger-datasource-*.zip
            gizmodata-hardcharger-datasource-*.zip.sha1
          retention-days: 7
          if-no-files-found: error

  # The one check to require in branch protection: red if any job failed or was cancelled.
  result:
    name: CI result
    if: always()
    needs: [gate, frontend, backend, e2e, package]
    runs-on: ubuntu-24.04-arm
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
