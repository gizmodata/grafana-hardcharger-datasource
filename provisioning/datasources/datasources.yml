# The development stack's data source: the Hardcharger server of docker-compose.yaml.
apiVersion: 1

datasources:
  - name: Hardcharger
    uid: hardcharger-dev
    type: gizmodata-hardcharger-datasource
    access: proxy
    isDefault: true
    editable: true
    jsonData:
      host: hardcharger
      port: 31337
      # The development server runs without TLS. Leave useTLS out (or true) for a real server.
      useTLS: false
      username: grafana
    secureJsonData:
      password: hardcharger-dev-password
